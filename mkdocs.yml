site_name: Rush Hour - Grafos

repo_url: https://github.com/projeto-de-algoritmos-2026/G15_Grafos_Rush_Hour
repo_name: G15_Grafos_Rush_Hour

site_url: https://projeto-de-algoritmos-2026.github.io/G15_Grafos_Rush_Hour/

nav:
  - Home: index.md
  - Inspiração: inspiração.md
  - Algoritmo A*: algoritmo.md
  - Demonstração: demonstração.md
  - Apresentação: apresentacao.md

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.top
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: green
      accent: green
      toggle:
        icon: material/weather-night
        name: Modo Noturno
    - scheme: slate
      primary: green
      accent: green
      toggle:
        icon: material/weather-sunny
        name: Modo Claro

markdown_extensions:
  - pymdownx.emoji
  - pymdownx.tasklist
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true
  - attr_list